<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面不存在 · 夜想集</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>">
  <link rel="stylesheet" href="/assets/style.css">
  <script>
    (function(){var s=localStorage.getItem("theme");var d=window.matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.setAttribute("data-theme",s||(d?"dark":"light"));})();
  </script>
</head>
<body>
  <main class="container" style="text-align:center; padding-top: 120px;">
    <h1 style="font-size:3rem; margin:0;">404</h1>
    <p style="color:var(--text-secondary);">这一页不存在，或者已经消失在夜色里了。</p>
    <p><a href="/">← 回到首页</a></p>
  </main>
  <script src="/assets/main.js"></script>
</body>
</html>
